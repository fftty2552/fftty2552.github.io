<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title> เขียนโค้ดด้วยภาษาที่เลือก (beta test)</title></title>
<style>
:root{--bg:#faf8f5;--fg:#1f1d1a;--mut:#6b665f;--card:#fff;--bd:#e4dfd7;--ac:#c2410c;--acfg:#fff;--code:#1e1e24;--codefg:#e8e6e3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#171614;--fg:#ece8e1;--mut:#9a948a;--card:#211f1c;--bd:#38342f;--ac:#fb923c;--acfg:#1a1209;--code:#0e0e11}}
:root[data-theme="dark"]{--bg:#171614;--fg:#ece8e1;--mut:#9a948a;--card:#211f1c;--bd:#38342f;--ac:#fb923c;--acfg:#1a1209;--code:#0e0e11}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 "Noto Sans Thai","Sarabun",system-ui,sans-serif}
main{max-width:1000px;margin:0 auto;padding:26px 16px 56px}
h1{font-size:1.5rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 18px}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
select,button{font:inherit;padding:7px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg);cursor:pointer}
button.pri{background:var(--ac);color:var(--acfg);border-color:var(--ac);font-weight:600}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:720px){.grid{grid-template-columns:1fr}}
.pane{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden;min-width:0}
.hd{padding:8px 12px;border-bottom:1px solid var(--bd);font-weight:600;display:flex;justify-content:space-between;align-items:center}
textarea,pre{margin:0;width:100%;height:420px;padding:12px;border:0;font:13.5px/1.6 ui-monospace,Menlo,Consolas,"Noto Sans Thai",monospace;tab-size:4;white-space:pre;overflow:auto}
textarea{background:var(--card);color:var(--fg);resize:vertical;outline:none}
pre{background:var(--code);color:var(--codefg)}
details{margin-top:16px;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:10px 14px}
summary{cursor:pointer;font-weight:600}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:4px 14px;margin-top:10px;font-size:.9rem}
.map span{color:var(--mut)}
.note{color:var(--mut);font-size:.9rem;margin-top:12px}
</style>
</head>
<body>
<main>
<h1>เขียนโค้ดด้วยภาษาที่เลือก (beta test)</h1>
<p class="sub">this is a project</p>

<div class="bar">
  <label>ภาษา <select id="lang"></select></label>
  <label>ทิศทาง
    <select id="dir">
      <option value="fwd">ภาษา → Python</option>
      <option value="rev">Python → ภาษา</option>
    </select>
  </label>
  <button id="swap">สลับช่อง</button>
</div>

<div class="grid">
  <div class="pane"><div class="hd"><span id="inT">โค้ดภาษาไทย</span></div><textarea id="src" spellcheck="false" placeholder="พิมพ์หรือวางโค้ดที่นี่"></textarea></div>
  <div class="pane"><div class="hd"><span id="outT">โค้ด Python</span><button class="pri" id="copy">คัดลอก</button></div><pre><code id="dst"></code></pre></div>
</div>

<p class="note">คัดลอกโค้ดที่แปลงไปใส่ python</p>

<details><summary>ตารางคำสั่งของภาษานี้</summary><div class="map" id="map"></div></details>
</main>

<script>
const PACKS = {
  th: { name: "ไทย", map: {
    "ถ้า":"if","หรือถ้า":"elif","มิฉะนั้น":"else","สำหรับ":"for","ใน":"in","ขณะที่":"while",
    "นิยาม":"def","คืนค่า":"return","คลาส":"class","นำเข้า":"import","จาก":"from","เป็น":"as",
    "และ":"and","หรือ":"or","ไม่":"not","คือ":"is","จริง":"True","เท็จ":"False","ว่าง":"None",
    "ผ่าน":"pass","หยุด":"break","ต่อ":"continue","ลอง":"try","ยกเว้น":"except","สุดท้าย":"finally",
    "ยกข้อผิดพลาด":"raise","ด้วย":"with","แลมบ์ดา":"lambda",
    "พิมพ์":"print","รับค่า":"input","ช่วง":"range","ความยาว":"len","จำนวนเต็ม":"int","ทศนิยม":"float",
    "ข้อความ":"str","รายการ":"list","พจนานุกรม":"dict","ผลรวม":"sum","มากสุด":"max","น้อยสุด":"min",
    "เรียง":"sorted","สัมบูรณ์":"abs","ปัดเศษ":"round","เปิดไฟล์":"open","นับลำดับ":"enumerate"
  }, sample:
`# หาจำนวนเฉพาะ
นิยาม เป็นจำนวนเฉพาะ(n):

        คืนค่า เท็จ

        ถ้า n % i == 0:
            คืนค่า เท็จ
    คืนค่า จริง

คะแนน = [45, 67, 82, 91]
สำหรับ ลำดับ, ค่า ใน นับลำดับ(คะแนน):
    ถ้า ค่า >= 80:
        เกรด = "A"
    หรือถ้า ค่า >= 60:
        เกรด = "B"
    มิฉะนั้น:
        เกรด = "C"
    พิมพ์(f"คนที่ {ลำดับ + 1}: {ค่า} คะแนน เกรด {เกรด}")

เฉพาะ = [x สำหรับ x ใน ช่วง(30) ถ้า เป็นจำนวนเฉพาะ(x)]
พิมพ์("จำนวนเฉพาะ:", เฉพาะ)
` },
  es: { name: "Español", map: {
    "si":"if","sino_si":"elif","sino":"else","para":"for","en":"in","mientras":"while",
    "definir":"def","devolver":"return","clase":"class","importar":"import","desde":"from","como":"as",
    "y":"and","o":"or","no":"not","es":"is","Verdadero":"True","Falso":"False","Nada":"None",
    "pasar":"pass","romper":"break","continuar":"continue","intentar":"try","excepto":"except",
    "finalmente":"finally","lanzar":"raise","con":"with",
    "imprimir":"print","leer":"input","rango":"range","largo":"len","entero":"int","decimal":"float",
    "texto":"str","lista":"list","diccionario":"dict","suma":"sum","maximo":"max","minimo":"min",
    "ordenar":"sorted","absoluto":"abs","redondear":"round","abrir":"open","enumerar":"enumerate"
  }, sample:
`definir doble(n):
    devolver n * 2

para i en rango(5):
    si i y no (i == 1):
        imprimir(f"doble de {i}:", doble(i))
    sino:
        imprimir("saltado", i)
` }
};

// คำพ้อง: หนึ่งคำสั่งของ Python ใช้ได้หลายคำ (คำแรกของแต่ละรายการคือคำหลักที่ใช้ตอนแปลงกลับ)
const SYN_TH = {
  print:["ปริ้น","ปริ้นท์","ปริ๊น","ปริ๊นท์","แสดง","แสดงผล"],
  input:["อินพุต","ป้อน"],
  if:["หาก","ถ้าหาก"],
  elif:["มิฉะนั้นถ้า","ไม่งั้นถ้า"],
  else:["ไม่งั้น","นอกนั้น"],
  for:["วนซ้ำ","วน"],
  in:["อยู่ใน"],
  while:["ตราบเท่าที่","ตราบใดที่"],
  def:["ฟังก์ชัน","สร้างฟังก์ชัน"],
  return:["ส่งคืน"],
  class:["ชั้น"],
  import:["อิมพอร์ต"],
  and:["แอนด์"],
  or:["ออร์"],
  not:["ไม่ใช่"],
  is:["ก็คือ"],
  True:["ใช่","ทรู"],
  False:["ผิด"],
  None:["ไม่มี"],
  pass:["ข้าม"],
  break:["เบรก","ออกจากลูป"],
  continue:["ข้ามรอบ","ทำต่อ"],
  try:["พยายาม"],
  except:["จับข้อผิดพลาด"],
  finally:["ท้ายสุด"],
  raise:["โยนข้อผิดพลาด"],
  lambda:["แลมด้า"],
  range:["เรนจ์"],
  len:["เลน"],
  int:["อินท์"],
  float:["ฟลอต"],
  str:["สตริง"],
  list:["ลิสต์"],
  dict:["ดิกต์"],
  max:["สูงสุด","แมกซ์"],
  min:["ต่ำสุด","มิน"],
  sorted:["จัดเรียง"]
};
for (const py in SYN_TH) for (const w of SYN_TH[py]) PACKS.th.map[w] = py;

// ครบชุด: keyword ที่เหลือ, builtin ทั้งหมด, ชื่อ exception
Object.assign(PACKS.th.map, {
  "ลบ":"del","ส่วนกลาง":"global","นอกฟังก์ชัน":"nonlocal","ยืนยัน":"assert","ส่งค่า":"yield","อะซิงค์":"async","รอ":"await",
  "ทุกตัว":"all","บางตัว":"any","บูล":"bool","แปลงเป็นอักษร":"chr","รหัสอักษร":"ord",
  "ฐานสอง":"bin","ฐานสิบหก":"hex","ฐานแปด":"oct","หารเอาเศษ":"divmod",
  "ประเมิน":"eval","สั่งรัน":"exec","กรอง":"filter","แมป":"map","จับคู่":"zip","กลับด้าน":"reversed",
  "เซต":"set","ทูเพิล":"tuple","ชนิดข้อมูล":"type","เป็นชนิด":"isinstance","เป็นคลาสย่อย":"issubclass",
  "มีแอตทริบิวต์":"hasattr","ดึงแอตทริบิวต์":"getattr","ตั้งแอตทริบิวต์":"setattr","ลบแอตทริบิวต์":"delattr",
  "ยกกำลัง":"pow","ซูเปอร์":"super","ถัดไป":"next","ตัววนซ้ำ":"iter","รหัสวัตถุ":"id",
  "จัดรูปแบบ":"format","รายชื่อสมาชิก":"dir","ช่วยเหลือ":"help","แฮช":"hash","เรียกได้":"callable",
  "วัตถุ":"object","คุณสมบัติ":"property","เมธอดสถิต":"staticmethod","เมธอดคลาส":"classmethod",
  "ไบต์":"bytes","อาร์เรย์ไบต์":"bytearray","จำนวนเชิงซ้อน":"complex","เซตคงที่":"frozenset","ชิ้นส่วน":"slice",
  "ตัวแปรทั้งหมด":"vars","ตัวแปรส่วนกลาง":"globals","ตัวแปรท้องถิ่น":"locals","แทนค่า":"repr","คอมไพล์":"compile",
  "ข้อผิดพลาด":"Exception","ข้อผิดพลาดค่า":"ValueError","ข้อผิดพลาดชนิด":"TypeError","ข้อผิดพลาดคีย์":"KeyError",
  "ข้อผิดพลาดดัชนี":"IndexError","หารด้วยศูนย์":"ZeroDivisionError","ข้อผิดพลาดชื่อ":"NameError",
  "ไม่พบไฟล์":"FileNotFoundError","นำเข้าไม่ได้":"ImportError","ข้อผิดพลาดแอตทริบิวต์":"AttributeError",
  "หยุดวนซ้ำ":"StopIteration","ผู้ใช้ขัดจังหวะ":"KeyboardInterrupt","ยืนยันไม่ผ่าน":"AssertionError","ข้อผิดพลาดขณะรัน":"RuntimeError","ข้อผิดพลาดระบบ":"OSError"
});

// ชื่อเมธอดที่เขียนหลังจุด (x.ชื่อ) ใช้ตารางแยกจาก keyword/builtin
PACKS.th.methods = {
  "เพิ่ม":"append","ขยาย":"extend","แทรก":"insert","เอาออก":"remove","ดึงออก":"pop","ล้าง":"clear",
  "หาตำแหน่ง":"index","นับ":"count","เรียงตัวเอง":"sort","กลับลำดับ":"reverse","คัดลอก":"copy",
  "แยก":"split","รวมด้วย":"join","ตัดขอบ":"strip","ตัดขอบซ้าย":"lstrip","ตัดขอบขวา":"rstrip","แทนที่":"replace",
  "ตัวพิมพ์ใหญ่":"upper","ตัวพิมพ์เล็ก":"lower","หัวเรื่อง":"title","ขึ้นต้นด้วย":"startswith","ลงท้ายด้วย":"endswith",
  "ค้นหา":"find","จัดรูปแบบ":"format","เป็นตัวเลข":"isdigit","เป็นตัวอักษร":"isalpha",
  "แยกบรรทัด":"splitlines","เข้ารหัส":"encode","ถอดรหัส":"decode",
  "คีย์":"keys","ค่าทั้งหมด":"values","คู่ทั้งหมด":"items","ดึงค่า":"get","อัปเดต":"update","ตั้งค่าเริ่ม":"setdefault",
  "เพิ่มเข้าเซต":"add","รวมเซต":"union","จุดตัดเซต":"intersection","ผลต่างเซต":"difference",
  "อ่าน":"read","เขียน":"write","อ่านบรรทัด":"readline","อ่านทุกบรรทัด":"readlines","ปิด":"close"
};

const IDENT = /[\p{L}_][\p{L}\p{M}\p{N}_]*/uy;

// แปลง NAME token เท่านั้น ไม่แตะ string/comment (นิพจน์ใน f-string จะถูกแปลด้วย)
function translate(src, map, mmap) {
  let out = "", i = 0;
  const n = src.length;
  while (i < n) {
    const c = src[i];
    if (c === "#") {
      let j = src.indexOf("\n", i); if (j < 0) j = n;
      out += src.slice(i, j); i = j; continue;
    }
    if (c === '"' || c === "'") { const r = readString(src, i, ""); out += r.text; i = r.end; continue; }
    IDENT.lastIndex = i;
    const m = IDENT.exec(src);
    if (m) {
      const w = m[0], e = i + w.length;
      if (/^[rRbBfFuU]{1,2}$/.test(w) && (src[e] === '"' || src[e] === "'")) {
        const r = readString(src, e, w); out += w + r.text.slice(0); i = r.end; // w คือ prefix
        continue;
      }
      const tbl = (out.slice(-1) === "." && mmap) ? mmap : map;
      out += Object.prototype.hasOwnProperty.call(tbl, w) ? tbl[w] : w;
      i = e; continue;
    }
    out += c; i++;
  }
  return out;

  function readString(s, start, prefix) {
    const q = s[start];
    const triple = s.startsWith(q.repeat(3), start);
    const delim = triple ? q.repeat(3) : q;
    let j = start + delim.length, body = "";
    while (j < s.length && !s.startsWith(delim, j)) {
      if (s[j] === "\\" && j + 1 < s.length) { body += s[j] + s[j + 1]; j += 2; continue; }
      if (!triple && s[j] === "\n") break;
      body += s[j++];
    }
    const closed = s.startsWith(delim, j);
    if (/f/i.test(prefix)) body = fexpr(body);
    return { text: delim + body + (closed ? delim : ""), end: j + (closed ? delim.length : 0) };
  }

  function fexpr(body) {
    let res = "", k = 0;
    while (k < body.length) {
      if (body[k] === "{" && body[k + 1] === "{") { res += "{{"; k += 2; continue; }
      if (body[k] === "{") {
        let d = 1, e = k + 1;
        while (e < body.length && d > 0) { if (body[e] === "{") d++; else if (body[e] === "}") d--; e++; }
        const inner = body.slice(k + 1, d === 0 ? e - 1 : e);
        let br = 0, cut = inner.length;
        for (let t = 0; t < inner.length; t++) {
          const ch = inner[t];
          if ("([{".includes(ch)) br++; else if (")]}".includes(ch)) br--;
          else if (br === 0 && (ch === ":" || (ch === "!" && inner[t + 1] !== "="))) { cut = t; break; }
        }
        res += "{" + translate(inner.slice(0, cut), map, mmap) + inner.slice(cut) + (d === 0 ? "}" : "");
        k = e; continue;
      }
      res += body[k++];
    }
    return res;
  }
}

const $ = id => document.getElementById(id);
let cur = "th";

function reverse(map) { const r = {}; for (const k in map) if (!(map[k] in r)) r[map[k]] = k; return r; }

function update() {
  const p = PACKS[cur], fwd = $("dir").value === "fwd";
  $("inT").textContent = fwd ? "โค้ดภาษา" + p.name : "โค้ด Python";
  $("outT").textContent = fwd ? "โค้ด Python" : "โค้ดภาษา" + p.name;
  $("dst").textContent = translate($("src").value, fwd ? p.map : reverse(p.map), fwd ? (p.methods || {}) : reverse(p.methods || {}));
}

function drawMap() {
  const box = $("map"); box.textContent = "";
  const g = {};
  for (const k in PACKS[cur].map) (g[PACKS[cur].map[k]] ||= []).push(k);
  const M = PACKS[cur].methods || {};
  for (const k in M) (g["." + M[k]] ||= []).push("." + k);
  for (const k in g) {
    const d = document.createElement("div");
    d.append(g[k].join(" / ") + " ");
    const s = document.createElement("span"); s.textContent = "→ " + k;
    d.appendChild(s); box.appendChild(d);
  }
}

for (const k in PACKS) { const o = document.createElement("option"); o.value = k; o.textContent = PACKS[k].name; $("lang").appendChild(o); }
$("lang").onchange = () => { cur = $("lang").value; drawMap(); update(); };
$("dir").onchange = update;
$("swap").onclick = () => { $("src").value = $("dst").textContent; $("dir").value = $("dir").value === "fwd" ? "rev" : "fwd"; update(); };
$("src").oninput = update;
// เยื้องบรรทัดให้อัตโนมัติ: Enter หลังบรรทัดที่ลงท้ายด้วย : จะเยื้องเพิ่ม 4 ช่อง, Tab ใส่ช่องว่าง 4 ช่อง
$("src").addEventListener("keydown", e => {
  if (e.isComposing) return;
  const t = e.target, s = t.selectionStart, v = t.value;
  const ins = txt => { if (!document.execCommand("insertText", false, txt)) t.setRangeText(txt, t.selectionStart, t.selectionEnd, "end"); update(); };
  if (e.key === "Enter" && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
    const ls = s === 0 ? 0 : v.lastIndexOf("\n", s - 1) + 1;
    const before = v.slice(ls, s);
    let ind = before.match(/^[ \t]*/)[0];
    const w0 = before.trim().split(/[\s(]/)[0];
    if (["return", "pass", "break", "continue", "raise"].includes(PACKS[cur].map[w0] || w0) && ind.length >= 4) ind = ind.slice(0, -4);
    e.preventDefault();
    ins("\n" + ind + (/:\s*$/.test(before) ? "    " : ""));
  } else if (e.key === "Tab" && !e.shiftKey) {
    e.preventDefault(); ins("    ");
  }
});
$("copy").onclick = async () => {
  try { await navigator.clipboard.writeText($("dst").textContent); $("copy").textContent = "คัดลอกแล้ว"; }
  catch (e) { $("copy").textContent = "คัดลอกไม่ได้"; }
  setTimeout(() => { $("copy").textContent = "คัดลอก"; }, 1500);
};
drawMap(); update();
</script>
</body>
</html>
